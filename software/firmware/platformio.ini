; POV LED Column v2 firmware - PlatformIO project (first compiled 2026-11-03, see docs/2026-11-03-firmware-build.md).
;
; Environments
;   pov      the column firmware: src/main.cpp + lib/povcore (column engine, .pova player, captions, web API, OTA)
;   pov_ota  the same firmware uploaded over Wi-Fi (ArduinoOTA, host pov.local); the password comes from
;            platformio_local.ini (gitignored; copy platformio_local.example.ini)
;   phase0   the bench bring-up sketch: src/phase0/phase0.cpp (one chain at a time, low brightness, test patterns,
;            hall readout, current-cap test, SPI frame-time measurement). USB only, rotor open.
;   native   host-side unit tests in test/ (povmap, frame builder, scheduler, pova, fonts, captions) with MinGW g++
;
; Toolchain (installed 2026-11-03 on the desktop PC, see software/firmware/README.md):
;   PlatformIO Core 6.2.0 in %USERPROFILE%\.platformio-venv (CPython 3.12 from uv); run it through tools\pio.cmd,
;   which also sets PLATFORMIO_CORE_DIR=C:\pio (the Arduino libs archive overflows MAX_PATH from the default home)
;   platform: pioarduino 55.03.312-1 = Arduino-ESP32 core 3.3.12 on ESP-IDF 5.5.5 (the official "espressif32"
;             platform stops at core 2.0.x; QA finding B1e)
;   native:   platformio/toolchain-gccmingw32 1.50100.0 (GCC 5.1), put on PATH by tools/native_env.py

[platformio]
default_envs = pov
src_dir = src
lib_dir = lib
test_dir = test
extra_configs = platformio_local*.ini

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev                       ; DOIT ESP32 DevKit V1, 30-pin, ESP32-WROOM-32, 4 MB flash, no PSRAM
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -Wall -Wextra
    -I lib/povcore
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0  ; the async TCP task stays on core 0; the column engine owns core 1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=10240 ; 8192 until 0.4; /api/status reports its free stack (diag.stack_free.async_tcp)

[env:pov]
extends = esp32
build_src_filter = +<*> -<phase0/>
; 0.4 = Wi-Fi control review 2026-11-14 (docs/2026-11-14-wifi-control-review.md). --wrap=esp_panic_handler turns on
; arduino-esp32's panic hook (set_arduino_panic_handler), which the Arduino IDE links but PlatformIO's pioarduino build
; does not: src/pov_crash.h uses it to keep a crash record for GET /api/crash.
build_flags =
    ${esp32.build_flags}
    -DPOV_FW_VERSION=\"0.4-2026-11-14\"
    -Wl,--wrap=esp_panic_handler
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3

[env:pov_ota]
; Prefer  py tools\ota_flash.py --env pov  (streams the image, retries, verifies the board runs the new build; see
; software/firmware/README.md). This env stays for pio's own espota upload. If pov.local does not resolve on your
; machine, set upload_port to the board's address in platformio_local.ini.
extends = env:pov
upload_protocol = espota
upload_port = pov.local
; upload_flags = --auth=... lives in platformio_local.ini (gitignored), see platformio_local.example.ini

[env:pov_crashtest]
; Rollback self-test image (OTA review 2026-11-13): the pov firmware with an abort() right after the LEDs are blanked.
; OTA it with  py tools\ota_flash.py --env pov_crashtest --expect-rollback : the bootloader must bring the previous
; image back by itself within ~20 s. Never flash it over USB (no previous OTA image to fall back to: USB recovery).
extends = env:pov
build_flags =
    ${env:pov.build_flags}
    -DPOV_OTA_CRASH_TEST

[env:phase0]
extends = esp32
build_src_filter = +<phase0/>
; phase0 carries its own version (0.3 = Wi-Fi auto-join, TCP 23 command port, NVS bench state)
build_flags =
    ${esp32.build_flags}
    -DPOV_FW_VERSION=\"0.3.2-2026-11-12\"
lib_deps =

[env:native]
platform = native @ 1.2.1
extra_scripts = pre:tools/native_env.py
build_flags =
    -std=gnu++14 -Wall -Wextra -DPOV_NATIVE -DUNITY_INCLUDE_DOUBLE
    -mfpmath=sse -msse2                ; IEEE double like the ESP32 (no x87 extended precision), so the ticker maths matches Python
    -static-libgcc -static-libstdc++
    -I lib/povcore -I test/vectors
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
test_framework = unity
test_build_src = no
